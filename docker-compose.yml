name: deployguard
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      APP_NAME: DeployGuard
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-REPLACE_WITH_A_UNIQUE_SECRET_KEY_AT_LEAST_32_CHARS}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deployguard}:${POSTGRES_PASSWORD:-deployguard_local_password}@postgres:5432/${POSTGRES_DB:-deployguard}
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      VERIFICATION_RUNNER_TYPE: ${VERIFICATION_RUNNER_TYPE:-docker}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [appnet]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [appnet]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployguard}
      POSTGRES_USER: ${POSTGRES_USER:-deployguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deployguard_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deployguard} -d ${POSTGRES_DB:-deployguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [appnet]

volumes:
  postgres_data:
networks:
  appnet:
    driver: bridge
